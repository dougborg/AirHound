name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: every job reads the repository only, unless it grants itself
# more below. Do not rely on the repository's default GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Lint workflows and embedded shell scripts
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # Rebase merges land every commit on main as written, and release-please reads
  # each one, so every commit in the pull request must be Conventional.
  lint-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Lint every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          npx --yes --package=@commitlint/cli@21.2.3
          --package=@commitlint/config-conventional@21.2.3
          -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
        with:
          components: rustfmt
      - run: cargo fmt --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - run: cd hostd && cargo fmt --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - run: cargo fmt --manifest-path firmware-std/Cargo.toml --check
        env:
          RUSTUP_TOOLCHAIN: nightly

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node --test .github/scripts/preview-comment.test.js
      - name: Check desktop utility syntax
        run: python3 -m py_compile scripts/*.py
      - name: Test desktop profiling tools
        run: python3 -B -m unittest discover -s scripts/tests -v

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - run: pip install check-jsonschema
      - name: Check JSON formatting
        run: just check-json
      - name: Validate schemas (metaschema)
        run: just check-schemas
      - name: Validate examples against schemas
        run: just check-examples
      - name: Validate serialized command response fixtures
        run: |
          check-jsonschema --schemafile schemas/device-message.v1.schema.json schemas/examples/*.device.json
          check-jsonschema --schemafile schemas/desktop-ble.v1.schema.json schemas/examples/*.desktop.json

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      - run: cargo test --locked --lib --no-default-features
        env:
          RUSTUP_TOOLCHAIN: nightly

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --lib --tests --no-default-features -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        env:
          RUSTUP_TOOLCHAIN: nightly
      - name: Audit dependencies
        run: |
          cargo audit
          cargo audit --file firmware-std/Cargo.lock
          cargo audit --file fuzz/Cargo.lock
        env:
          RUSTUP_TOOLCHAIN: nightly
      - name: Audit hostd dependencies
        run: cd hostd && cargo audit
        env:
          RUSTUP_TOOLCHAIN: nightly

  hostd:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install scanner dev dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libpcap-dev
      - name: Check
        run: cd hostd && cargo check --locked
      - name: Clippy
        run: cd hostd && cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cd hostd && cargo test --locked
      - name: Public API build and tests
        if: runner.os == 'macOS'
        working-directory: hostd
        run: |
          cargo test --locked --no-default-features
          cargo clippy --locked --no-default-features --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf-rust:all_1.90.0.0
      options: --user root
      env:
        RUSTUP_HOME: /home/esp/.rustup
        CARGO_HOME: /home/esp/.cargo
    strategy:
      matrix:
        include:
          - name: xiao
            target: xtensa-esp32s3-none-elf
            features: xiao
          - name: m5stickc
            target: xtensa-esp32-none-elf
            features: m5stickc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build ${{ matrix.name }}
        run: |
          export PATH="/home/esp/.cargo/bin:$PATH"
          . /home/esp/export-esp.sh
          cargo build --locked --no-default-features --features ${{ matrix.features }} --release --target ${{ matrix.target }} -Z build-std=core,alloc

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: elf-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/airhound
          retention-days: 7

  build-std:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf-rust:all_1.90.0.0
      options: --user root
      env:
        RUSTUP_HOME: /home/esp/.rustup
        CARGO_HOME: /home/esp/.cargo
    strategy:
      matrix:
        include:
          - name: xiao-std
            target: xtensa-esp32s3-espidf
            chip: esp32s3
            features: xiao
          - name: m5stickc-std
            target: xtensa-esp32-espidf
            chip: esp32
            features: m5stickc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build ${{ matrix.name }}
        run: |
          export PATH="/home/esp/.cargo/bin:$PATH"
          . /home/esp/export-esp.sh
          cd firmware-std && MCU=${{ matrix.chip }} cargo build --locked --no-default-features --features ${{ matrix.features }} --release --target ${{ matrix.target }} -Z build-std=std,panic_abort

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: elf-${{ matrix.name }}
          path: firmware-std/target/${{ matrix.target }}/release/airhound-std
          retention-days: 7

  simulation-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      - id: token
        env:
          TOKEN_SET: ${{ secrets.WOKWI_CLI_TOKEN != '' }}
        run: |
          echo "enabled=$TOKEN_SET" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_SET" != "true" ]; then
            echo "### Wokwi: not run (WOKWI_CLI_TOKEN is unavailable)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Optional execution evidence, never a substitute for hardware validation.
  wokwi:
    needs: [build, simulation-config]
    if: needs.simulation-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: elf-m5stickc
          path: target/xtensa-esp32-none-elf/release/

      - name: Simulate firmware
        uses: wokwi/wokwi-ci-action@11ddc3fe66a14fcd46683fb21ae5c77657ad4606 # v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          timeout: 10000
          expect_text: "AirHound v"

  preview-binaries:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: xiao
            chip: esp32s3
          - name: m5stickc
            chip: esp32
    steps:
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install espflash
        run: cargo binstall espflash --no-confirm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: elf-${{ matrix.name }}

      - name: Create flashable binary
        run: espflash save-image --merge --skip-padding --chip ${{ matrix.chip }} airhound airhound-${{ matrix.name }}.bin

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bin-${{ matrix.name }}
          path: airhound-${{ matrix.name }}.bin
          retention-days: 14

  preview-binaries-std:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: build-std
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: xiao-std
            chip: esp32s3
          - name: m5stickc-std
            chip: esp32
    steps:
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install espflash
        run: cargo binstall espflash --no-confirm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: elf-${{ matrix.name }}

      - name: Create flashable binary
        run: espflash save-image --merge --skip-padding --chip ${{ matrix.chip }} airhound-std airhound-${{ matrix.name }}.bin

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bin-${{ matrix.name }}
          path: airhound-${{ matrix.name }}.bin
          retention-days: 14

  preview-comment:
    name: Post Artifact Links
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !cancelled()
    needs: [preview-binaries, preview-binaries-std]
    runs-on: ubuntu-latest
    permissions:
      contents: read # sparse checkout of .github/scripts
      actions: read # list this run's artifacts
      pull-requests: write # create or update the preview comment on the PR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const script = require('./.github/scripts/preview-comment.js');
            await script({ github, context, needs: ${{ toJSON(needs) }} });
