name: Desktop performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hostd/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/benchmark-hostd.py'
      - 'scripts/bundle-macos.py'
      - 'justfile'
      - '.github/workflows/desktop-performance.yml'
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f
        with:
          toolchain: stable
      - name: Install Linux scanner dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libpcap-dev
      - name: Measure production pipeline
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/benchmark-hostd.py
      - name: Verify macOS app packaging
        if: runner.os == 'macOS'
        run: python3 scripts/bundle-macos.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-performance-${{ matrix.os }}
          path: hostd/target/performance/benchmark.json
          if-no-files-found: error
          retention-days: 30
