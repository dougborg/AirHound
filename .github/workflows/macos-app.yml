name: Native macOS app

on:
  push:
    branches: [main]
    paths: ['apps/macos/**', 'hostd/**', 'Cargo.toml', '.github/workflows/macos-app.yml']
  pull_request:
    paths: ['apps/macos/**', 'hostd/**', 'Cargo.toml', '.github/workflows/macos-app.yml']

# Supersede only earlier runs for this pull request. Other events retain
# independent groups so a PR update cannot cancel main or release validation.
concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test GUI build metadata
        run: python3 -m unittest discover -s apps/macos/Tests/BuildMetadataTests
      - name: Build shared backend
        run: cargo +stable build --manifest-path hostd/Cargo.toml --release --locked --bin airhound-hostd
      - name: Test presentation and real service lifecycle
        working-directory: apps/macos
        env:
          AIRHOUND_TEST_BACKEND: ${{ github.workspace }}/hostd/target/release/airhound-hostd
        run: python3 run-tests.py --diagnostics-dir "$RUNNER_TEMP/airhound-native-tests" -- swift test --enable-code-coverage
      - name: Upload native test stall diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-test-stall-${{ github.run_id }}
          path: ${{ runner.temp }}/airhound-native-tests
          if-no-files-found: ignore
      - name: Gate presentation-core coverage
        working-directory: apps/macos
        run: python3 check-coverage.py "$(swift test --show-codecov-path)"
      - name: Build native app bundle
        working-directory: apps/macos
        run: sh bundle.sh "$GITHUB_WORKSPACE/hostd/target/release/airhound-hostd"
      - name: Validate app bundle
        run: |
          test -x apps/macos/dist/AirHound.app/Contents/Helpers/airhound-hostd
          apps/macos/dist/AirHound.app/Contents/Helpers/airhound-hostd --help >/dev/null
          plutil -lint apps/macos/dist/AirHound.app/Contents/Info.plist
          codesign --verify --deep --strict apps/macos/dist/AirHound.app
          test -n "$(find apps/macos/dist/AirHound.app -name example.ndjson -print -quit)"
