name: MCP adapter

on:
  pull_request:
    paths: ['clients/mcp/**', 'hostd/crates/**', '.github/workflows/mcp.yml']
  push:
    branches: [main]
    paths: ['clients/mcp/**', 'hostd/crates/**', '.github/workflows/mcp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    name: MCP protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: clients/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
