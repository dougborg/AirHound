name: MT7610U driver experiment

on:
  pull_request:
    paths: ['drivers/mt7610u/**', '.github/workflows/mt7610u.yml']
  push:
    branches: [main]
    paths: ['drivers/mt7610u/**', '.github/workflows/mt7610u.yml']
  workflow_dispatch:

# Supersede only older validation runs for the same pull request. Main, manual,
# scheduled and reusable release runs keep independent groups.
concurrency:
  group: mt7610u-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: driver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: drivers/mt7610u
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit
