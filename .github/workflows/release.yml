name: Release

on:
  push:
    branches: [main]

# Least privilege: jobs read the repository only, unless they grant themselves
# more below. release-please writes with the release-please App token, not
# GITHUB_TOKEN, so it needs no write grant here.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release PR is opened with an installation token minted from the
      # release-please GitHub App instead of GITHUB_TOKEN, so the pull_request
      # workflows behind CI checks actually run on it (GITHUB_TOKEN-authored
      # events never trigger downstream workflows). Without the App
      # credentials the job fails here with a clear message rather than inside
      # create-github-app-token.
      - name: Require the release App credentials
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$PRIVATE_KEY_SET" != "true" ]; then
            echo "::error::Set the RELEASE_PLEASE_APP_ID variable and RELEASE_PLEASE_APP_PRIVATE_KEY secret (dougborg-release-please App) in the repository settings."
            exit 1
          fi

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses: the release branch, tags and
          # Releases (contents), the release PR (pull-requests), and its
          # autorelease labels (issues).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf-rust:${{ matrix.chip }}_latest
      options: --user root
      env:
        RUSTUP_HOME: /home/esp/.rustup
        CARGO_HOME: /home/esp/.cargo
    strategy:
      matrix:
        include:
          - name: xiao
            target: xtensa-esp32s3-none-elf
            chip: esp32s3
            features: xiao
          - name: m5stickc
            target: xtensa-esp32-none-elf
            chip: esp32
            features: m5stickc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build ${{ matrix.name }}
        run: |
          export PATH="/home/esp/.cargo/bin:$PATH"
          . /home/esp/export-esp.sh
          cargo build --no-default-features --features ${{ matrix.features }} --release --target ${{ matrix.target }} -Z build-std=core,alloc

      - name: Create flashable binary
        run: |
          export PATH="/home/esp/.cargo/bin:$PATH"
          . /home/esp/export-esp.sh
          espflash save-image --chip ${{ matrix.chip }} target/${{ matrix.target }}/release/airhound airhound-${{ matrix.name }}.bin

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-bin-${{ matrix.name }}
          path: airhound-${{ matrix.name }}.bin

  publish-release:
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach binaries to the draft release and publish it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-bin-*
          merge-multiple: true

      # release-please creates the release as a draft (draft: true in
      # release-please-config.json). Immutable releases reject asset uploads
      # once a release is published, so the binaries have to go on while it is
      # still a draft — this step attaches them and publishes in one call.
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: "*.bin"
          draft: false
