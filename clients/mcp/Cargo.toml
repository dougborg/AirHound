[package]
name = "airhound-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Passive MCP presentation adapter for an AirHound control backend"

[workspace]

[dependencies]
airhound-client = { path = "../../hostd/crates/airhound-client" }
airhound-api = { path = "../../hostd/crates/airhound-api" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process"] }
