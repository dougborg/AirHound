[package]
name = "airhound-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
airhound-client = { path = "../../hostd/crates/airhound-client" }
airhound-api = { path = "../../hostd/crates/airhound-api" }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "sync"] }
