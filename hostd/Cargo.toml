[package]
name = "airhound-hostd"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "airhound-hostd"
description = "AirHound host daemon — BLE surveillance detection for Mac/Linux"

[features]
default = ["macos-private-addresses"]
macos-private-addresses = ["dep:corebluetooth-address"]

[dependencies]
airhound = { path = "..", default-features = false, features = ["board-host"] }
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "io-util", "net", "fs"] }
futures-lite = "2"
log = "0.4"
env_logger = "0.11"
heapless = { version = "0.9.4", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wifi_scan = "0.7.3"
corebluetooth-address = { version = "=0.1.0", optional = true }
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation"] }
objc2-foundation = { version = "0.3", features = ["NSObject"] }
objc2 = "0.6"
objc2-core-bluetooth = { version = "0.3", default-features = false, features = ["std", "CBCentralManager", "CBManager"] }
plist = "1.10.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[target.'cfg(target_os = "linux")'.dependencies]
pcap = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
