[package]
name = "airhound-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared AirHound local control client and bounded framing"

[dependencies]
airhound-api = { path = "../airhound-api" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
